# Spectral Domain Pipeline Configuration
# Configuration for spectral-only classification

preprocessing:
  normalization_method: "zscore" # 'zscore' or 'minmax'
  detrending_method: "linear" # 'linear', 'polynomial', or 'savgol'
  detrend_polynomial_order: 3
  window_size: 100

feature_extraction:
  type: "spectral"
  sampling_rate: 1.0 # Hz (adjust based on data)

  fft_options:
    n_fft: 256
    overlap_ratio: 0.5

  features:
    # FFT and Power Spectral Density
    - "fft_magnitude_stats"
    - "psd_mean"
    - "psd_std"

    # Frequency-domain characteristics
    - "dominant_frequency"
    - "spectral_centroid"
    - "spectral_entropy"
    - "spectral_rolloff"
    - "spectral_bandwidth"

    # Harmonic analysis
    - "fundamental_frequency"
    - "harmonic_amplitudes"
    - "harmonic_energy_ratio"

    # Band powers
    - "dc_power"
    - "low_freq_power"
    - "mid_freq_power"
    - "high_freq_power"

model:
  type: "random_forest"
  hyperparameters:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
    criterion: "gini"

training:
  test_size: 0.2
  random_state: 42
  validation_strategy: "stratified_kfold"
  n_splits: 5

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

  include_per_class_analysis: true
  include_confusion_matrix: true
  include_classification_report: true

# Notes on Spectral Domain:
# - Captures frequency content and harmonic characteristics
# - Effective for appliances with distinct frequency signatures
# - Computationally more expensive (FFT required)
# - Robust to temporal shifts
# - May lose temporal dynamics information
