# Hybrid Domain Pipeline Configuration
# Configuration for hybrid temporal+spectral classification

preprocessing:
  normalization_method: "zscore" # 'zscore' or 'minmax'
  detrending_method: "linear" # 'linear', 'polynomial', or 'savgol'
  detrend_polynomial_order: 3
  window_size: 100

feature_extraction:
  type: "hybrid"
  sampling_rate: 1.0 # Hz (adjust based on data)

  temporal_features:
    enabled: true
    features:
      - "rms"
      - "variance"
      - "skewness"
      - "kurtosis"
      - "entropy"
      - "autocorr_lag1"
      - "zero_crossing_rate"
      - "signal_energy"

  spectral_features:
    enabled: true
    fft_options:
      n_fft: 256
      overlap_ratio: 0.5
    features:
      - "dominant_frequency"
      - "spectral_centroid"
      - "spectral_entropy"
      - "harmonic_amplitudes"
      - "band_powers"

feature_selection:
  enabled: true
  method: "mutual_information" # 'mutual_information', 'variance', 'correlation'
  n_features_to_select: 50 # Select top N features

dimensionality_reduction:
  enabled: true
  method: "pca" # 'pca', 'tsne', 'umap'
  n_components: 30
  variance_threshold: 0.95

model:
  type: "random_forest"
  hyperparameters:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
    criterion: "gini"

training:
  test_size: 0.2
  random_state: 42
  validation_strategy: "stratified_kfold"
  n_splits: 5

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

  include_per_class_analysis: true
  include_confusion_matrix: true
  include_classification_report: true
  include_feature_importance: true
  include_domain_comparison: true

# Notes on Hybrid Domain:
# - Combines complementary information from temporal and spectral domains
# - Leverages both dynamics and frequency characteristics
# - Higher dimensionality requires careful feature selection
# - Feature redundancy between domains must be managed
# - Potential for superior performance but increased computational cost
